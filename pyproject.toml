[project]
name = "qcode-discovery"
version = "0.1.0"
description = "Discovering quantum LDPC codes via LLM-guided evolutionary search"
requires-python = ">=3.10"
dependencies = [
    "qldpc",
    "ldpc",
    "numpy",
    "scipy",
    "galois",
    "sympy",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "python-igraph>=1.0.0",
]
evolve = [
    "openevolve",
    "litellm[proxy]",
]
tracking = [
    "wandb",
]
# Webster et al. (arXiv:2603.22532) distance package, for the cross-check in
# investigations/webster_comparison_plan.md. Kept separate from `dev` because it
# pulls a heavy transitive stack (ortools, qiskit, numba, python-sat, gurobipy).
# Install with: uv sync --group dev --group webster
webster = [
    "codedistance>=0.0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (distance estimation, full evaluation)",
    "webster: marks tests that require the optional `codedistance` package (uv sync --group webster)",
]
